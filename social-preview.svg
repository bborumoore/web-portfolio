      <stop offset="0%" stop-color="#131416" />
      <stop offset="100%" stop-color="#1d1f24" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="80" y="80" width="1040" height="470" rx="28" fill="#f6f7fa" />
